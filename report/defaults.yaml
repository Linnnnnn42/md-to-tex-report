# Pandoc build configuration shared by every report directory.
# ${.} is the folder that holds this file, so paths work from any working directory.
# A report directory can override any of these settings in its own report.yaml.

from: markdown
to: latex
standalone: true
template: ${.}/template.tex

# Heading mapping:
#   #     -> \chapter
#   ##    -> \section
#   ###   -> \subsection
#   ####  -> \subsubsection (unnumbered, because secnumdepth is 2)
#   ##### -> \paragraph
# Set this to "section" to map # to \section instead (e.g. for an article-style report).
top-level-division: chapter

# Numbers are generated by LaTeX, so Markdown headings must not contain them.
number-sections: true
table-of-contents: true
# Heading levels shown in the contents: 3 = chapters, sections and subsections.
toc-depth: 3

filters:
  - ${.}/filters/missing-images.lua
  - ${.}/filters/appendix.lua
  - ${.}/filters/numeric-citations.lua

variables:
  documentclass: report
  papersize: a4
  fontsize: 12pt
  geometry: margin=2.5cm
  linestretch: 1.25
  # Clickable contents and cross-references, shown in blue instead of boxed.
  colorlinks: true
  linkcolor: blue
  toccolor: blue
  urlcolor: blue
  citecolor: blue
  # Number chapters, sections and subsections (x.y.z), but not deeper levels.
  secnumdepth: 2
  # Where figures go. H = exactly where they appear in the Markdown.
  # htbp = let LaTeX move them to the top/bottom of a page (classic LaTeX style).
  figure-placement: H
